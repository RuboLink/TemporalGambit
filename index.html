<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏱️⌛Chess Timer⌛⏱️</title>
</head>
<body>
    <main>
        <h1 class="main_title">Configura tu reloj</h1>
        
        <br/>
        <p id="different_times">
            <label id="both_times">Tiempo de cada reloj: 
                <select id="tiempos_list">
                    <option value="1">1 min</option>
                    <option value="3">3 min</option>
                    <option value="5">5 min</option>
                    <option value="10">10 min</option>
                    <option value="15">15 min</option>
                    <option value="20">20 min</option>
                    <option value="30">30 min</option>
                    <option value="60">60 min</option>
                    <option value="90">90 min</option>
                </select>
            </label>
        </p>
        <input type="checkbox" id="different_box">Tiempos distintos para cada jugador</input>
        
        <br/>
        
        <input type="checkbox" id="increment_box">Con incremento</input>
        <p id="increment_list"></p>

        <button id="ready_button">¡Todo listo!</button>
    </main>
    <button class="config_buttons" hidden="true">Configuracion</button>
    
    <script src="script.js"></script>
</body>
</html>
