<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏱️⌛Chess Timer⌛⏱️</title>
</head>
<body>
    <h1 class="main_title">Configura tu reloj</h1>
    
    <br/>
    <p id="different_times">
        <label>Tiempo de cada reloj: 
            <select id="tiempos_list">
                <option>1 min</option>
                <option>3 min</option>
                <option>5 min</option>
                <option>10 min</option>
                <option>15 min</option>
                <option>20 min</option>
                <option>30 min</option>
                <option>60 min</option>
                <option>90 min</option>
            </select>
        </label>
    </p>
    <input type="checkbox" id="different_box">Tiempos distintos para cada jugador</input>
    
    <br/>
    
    <input type="checkbox" id="increment_box">Con incremento</input>
    <p id="increment_list"></p>

    <button>¡Todo listo!</button>
    <script src="script.js"></script>
</body>
</html>
